name: bestall
services:
  frontend:
    env_file:
      - secrets.env
    restart: always
    environment:
      - NUXT_PUBLIC_ENABLED_AUTH=${NUXT_ENABLED_AUTH}
      - NUXT_PUBLIC_HIDE_GU_AUTH_PARAM_NAME=${NUXT_HIDE_GU_AUTH_PARAM_NAME}
      - NUXT_PUBLIC_HIDE_GU_AUTH_PARAM_VALUE=${NUXT_HIDE_GU_AUTH_PARAM_VALUE}
      - NUXT_PUBLIC_LOCALE_PARAM_NAME=${NUXT_LOCALE_PARAM_NAME}
      - NUXT_PUBLIC_MYLOANS_URL=${NUXT_MYLOANS_URL}
      - NUXT_PUBLIC_DATE_FORMAT=${NUXT_DATE_FORMAT}
      - NUXT_PUBLIC_APPLICATION_IS_CLOSED=${NUXT_APPLICATION_IS_CLOSED}
      - NUXT_PUBLIC_DEBUG_INFO=${NUXT_DEBUG_INFO}
      - NUXT_PUBLIC_RESERVE_NOTE_MAX_LENGTH=${NUXT_RESERVE_NOTE_MAX_LENGTH}
      - NUXT_PUBLIC_GITHUB_CLIENT_ID=${NUXT_GITHUB_CLIENT_ID}
      - NUXT_PUBLIC_GU_CLIENT_ID=${NUXT_PUBLIC_GU_CLIENT_ID}
      - NUXT_PUBLIC_SHOW_AUTH_STATUS=${NUXT_PUBLIC_SHOW_AUTH_STATUS}
      - NUXT_XACCOUNT_MAP_TO_GITHUB=${NUXT_XACCOUNT_MAP_TO_GITHUB}
      - NUXT_API_BASE=${NUXT_API_BASE}
      - AUTH_ORIGIN=${AUTH_ORIGIN}
      - NUXT_PUBLIC_SHOW_HEADER_LOGO_ON_SMALL_DEVICES=${NUXT_PUBLIC_SHOW_HEADER_LOGO_ON_SMALL_DEVICES}
      - NUXT_PUBLIC_SHOW_ERROR_CONTACT_FORM=${NUXT_PUBLIC_SHOW_ERROR_CONTACT_FORM}
      - NUXT_PUBLIC_SHOW_ORDER_STEPS=${NUXT_PUBLIC_SHOW_ORDER_STEPS}
      - NUXT_PUBLIC_TOAST_DURATION_MS=${NUXT_PUBLIC_TOAST_DURATION_MS}
      - NUXT_PUBLIC_SHOW_STATUS_LIMITATION_TOAST=${NUXT_PUBLIC_SHOW_STATUS_LIMITATION_TOAST}
      - NUXT_PUBLIC_MYLOANS_URL_SV=${NUXT_PUBLIC_MYLOANS_URL_SV}
      - NUXT_PUBLIC_MYLOANS_URL_EN=${NUXT_PUBLIC_MYLOANS_URL_EN}
      - NUXT_PUBLIC_LIBRARY_CARD_URL_SV=${NUXT_PUBLIC_LIBRARY_CARD_URL_SV}
      - NUXT_PUBLIC_LIBRARY_CARD_URL_EN=${NUXT_PUBLIC_LIBRARY_CARD_URL_EN}
      - NUXT_PUBLIC_GU_HOME_URL_SV=${NUXT_PUBLIC_GU_HOME_URL_SV}
      - NUXT_PUBLIC_GU_HOME_URL_EN=${NUXT_PUBLIC_GU_HOME_URL_EN}
      - NUXT_PUBLIC_UB_HOME_URL_SV=${NUXT_PUBLIC_UB_HOME_URL_SV}
      - NUXT_PUBLIC_UB_HOME_URL_EN=${NUXT_PUBLIC_UB_HOME_URL_EN}
      - NUXT_PUBLIC_UB_CONTACT_URL_SV=${NUXT_PUBLIC_UB_CONTACT_URL_SV}
      - NUXT_PUBLIC_UB_CONTACT_URL_EN=${NUXT_PUBLIC_UB_CONTACT_URL_EN}
      - NUXT_PUBLIC_GU_PRIVACY_URL_SV=${NUXT_PUBLIC_GU_PRIVACY_URL_SV}
      - NUXT_PUBLIC_GU_PRIVACY_URL_EN=${NUXT_PUBLIC_GU_PRIVACY_URL_EN}
      - NUXT_PUBLIC_FOOTER_LIBRARY_URL_SV=${NUXT_PUBLIC_FOOTER_LIBRARY_URL_SV}
      - NUXT_PUBLIC_FOOTER_LIBRARY_URL_EN=${NUXT_PUBLIC_FOOTER_LIBRARY_URL_EN}
      - NUXT_PUBLIC_FOOTER_CONTACT_URL_SV=${NUXT_PUBLIC_FOOTER_CONTACT_URL_SV}
      - NUXT_PUBLIC_FOOTER_CONTACT_URL_EN=${NUXT_PUBLIC_FOOTER_CONTACT_URL_EN}
      - NUXT_PUBLIC_FOOTER_ACCESSIBILITY_URL_SV=${NUXT_PUBLIC_FOOTER_ACCESSIBILITY_URL_SV}
      - NUXT_PUBLIC_FOOTER_ACCESSIBILITY_URL_EN=${NUXT_PUBLIC_FOOTER_ACCESSIBILITY_URL_EN}
    stdin_open: true
    tty: true
    networks:
      - backend
  backend:
    restart: always
    env_file:
      - secrets.env
    environment:
      - RAILS_ENV=${ENVIRONMENT}
      - RAILS_LOG_TO_STDOUT=1
      - RAILS_PORT=${RAILS_PORT}
      - BESTALL_REGISTRATION_URL=${REGISTRATION_URL}
      - BESTALL_MYLOANS_URL=${MYLOANS_URL}
      - BESTALL_KOHA_USER=${KOHA_USER}
      - BESTALL_KOHA_SVC_URL=${KOHA_SVC_URL}
      - BESTALL_KOHA_SVC_AUTH_URL=${KOHA_SVC_AUTH_URL}
      - SHOW_PICKUP_CODE=${SHOW_PICKUP_CODE}
    command: ["bundle", "exec", "rails", "server", "-b", "0.0.0.0"]
    networks:
      - backend
    ports:
      - ${BACKEND_HOST_PORT}:${RAILS_PORT}
networks:
  backend:
