version: "3.7"
services:
  frontend:
    image: docker.ub.gu.se/bestall-frontend:${GIT_REVISION}
    build:
      context: ./frontend-nuxt
      args:
        - GIT_REPO_URL=${GIT_REPO_URL}
        - GIT_REVISION=${GIT_REVISION}
    platform: linux/amd64
  backend:
    image: docker.ub.gu.se/bestall-backend:${GIT_REVISION}
    build:
      context: ./backend
      args:
        - GIT_REPO_URL=${GIT_REPO_URL}
        - GIT_REVISION=${GIT_REVISION}
